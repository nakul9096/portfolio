<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart College</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4 antialiased text-slate-100">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl rounded-2xl shadow-2xl shadow-blue-950/50 border border-blue-500/20 p-8 transition-all">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600/20 text-blue-400 rounded-xl mb-3 border border-blue-500/30 shadow-lg shadow-blue-500/10">
                <i data-lucide="graduation-cap" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">
                Smart<span class="text-blue-400">College</span>
            </h1>
            <p class="text-sm text-slate-400 mt-1">Student & Teacher Portal</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-blue-300/80 mb-1.5">
                    Email / Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input 
                        id="email" 
                        type="text" 
                        placeholder="e.g. user@college.edu" 
                        required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 transition-all focus:bg-slate-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    >
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-blue-300/80 mb-1.5">
                    Password / Phone
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input 
                        id="password" 
                        type="password" 
                        placeholder="••••••••" 
                        required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 transition-all focus:bg-slate-900 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                    >
                </div>
            </div>

            <button 
                id="loginBtn" 
                type="submit"
                class="w-full mt-2 py-3 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-blue-600/30 transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center space-x-2"
            >
                <span>Login</span>
            </button>
        </form>

        <!-- Dynamic Error Box -->
        <div id="error" class="hidden mt-4 p-3 bg-red-950/50 border border-red-500/30 text-red-300 text-xs rounded-xl flex items-center space-x-2">
            <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-red-400"></i>
            <span id="errorMessage"></span>
        </div>

        <!-- Help Info Card -->
        <div class="mt-6 p-3.5 bg-blue-950/30 border border-blue-500/20 rounded-xl text-xs text-slate-400 space-y-1">
            <p class="flex items-center space-x-1.5 font-medium text-blue-300">
                <i data-lucide="info" class="w-3.5 h-3.5 text-blue-400"></i>
                <span>Credentials Guide</span>
            </p>
            <p><strong class="text-slate-300">Teachers:</strong> Registered email & password.</p>
            <p><strong class="text-slate-300">Students:</strong> Registered email & phone number.</p>
        </div>

    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Supabase Setup
        const SUPABASE_URL = "https://mtlwhftvndqguofxhhcc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_uchg-Fclifz45WyCpgBgQw_bq6x3Z06";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // SHA-256 Hashing
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        // Error display handler
        function showError(message) {
            const errorBox = document.getElementById("error");
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = message;
            errorBox.classList.remove("hidden");
        }

        // Submit listener
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("loginBtn");
            const errorBox = document.getElementById("error");

            errorBox.classList.add("hidden");

            if (!email || !password) {
                showError("Please enter email and password.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Checking...</span>`;
            lucide.createIcons();

            try {
                // 1. Check Admin/Teacher
                const hashedPassword = await hashPassword(password);
                const { data: admin, error: adminError } = await supabaseClient
                    .from("admins")
                    .select("*")
                    .eq("email", email)
                    .eq("password_hash", hashedPassword)
                    .eq("status", "active")
                    .maybeSingle();

                if (adminError) console.error("Admin query error:", adminError);

                if (admin) {
                    localStorage.removeItem("student");
                    localStorage.setItem("admin", JSON.stringify(admin));
                    localStorage.setItem("userRole", admin.role);
                    window.location.href = "dashboard.html";
                    return;
                }

                // 2. Check Student
                const { data: student, error: studentError } = await supabaseClient
                    .from("students")
                    .select("*")
                    .eq("email", email)
                    .eq("phone", password)
                    .maybeSingle();

                if (studentError) {
                    console.error("Student query error:", studentError);
                    showError("Unable to connect to the database.");
                    return;
                }

                if (student) {
                    localStorage.removeItem("admin");
                    localStorage.setItem("student", JSON.stringify(student));
                    localStorage.setItem("userRole", "student");
                    window.location.href = "studentdashboard.html";
                    return;
                }

                // 3. Fallback
                showError("Invalid email or password.");

            } catch (error) {
                console.error("Login Handler Error:", error);
                showError("Something went wrong. Please try again.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Login</span>`;
            }
        });
    </script>
</body>
</html>
