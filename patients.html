<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Management Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Import Your Global Configuration File -->
<script src="config/config.js"></script>

<!-- XLSX Library for Direct Excel Export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #0b0f19;
  --card-bg: #151c2c;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --border-color: #26334d;
  --danger: #f87171;
  --warning: #fbbf24;
  --success: #34d399;
  --radius-lg: 16px;
  --radius-md: 10px;
  --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 20px;
}

/* Header & Controls */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}

.header-title h1 { margin: 0; font-size: 26px; font-weight: 700; }
.header-title p { margin: 4px 0 0; color: var(--text-muted); font-size: 14px; }

.export-btn {
  background: #10b981;
  color: #fff;
  border: 0;
  border-radius: var(--radius-md);
  padding: 10px 18px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.export-btn:hover { background: #059669; }

/* Search & Filter Bar */
.filter-container {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.search-box {
  flex: 1;
  min-width: 260px;
}

.search-box input {
  width: 100%;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: #0f172a;
  color: #fff;
  outline: none;
  font-size: 14px;
}

.search-box input:focus { border-color: var(--primary); }

.filter-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pill-btn {
  background: #0f172a;
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.pill-btn:hover, .pill-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* Patient Grid Cards */
.patient-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.patient-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.2s, border-color 0.2s;
}

.patient-card:hover {
  transform: translateY(-4px);
  border-color: var(--primary);
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.patient-id-badge {
  background: rgba(59, 130, 246, 0.15);
  color: #60a5fa;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
}

.risk-badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
}

.risk-high { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
.risk-moderate { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
.risk-low { background: rgba(52, 211, 153, 0.15); color: var(--success); }

.patient-name {
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 6px;
}

.patient-subtext {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.view-btn {
  width: 100%;
  background: #1e293b;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.view-btn:hover {
  background: var(--primary);
  color: #fff;
}

/* Modal Styling */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  width: 90%;
  max-width: 600px;
  padding: 28px;
  box-shadow: var(--shadow-md);
  position: relative;
}

.modal-close {
  position: absolute;
  top: 18px;
  right: 20px;
  background: transparent;
  border: 0;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 20px;
}

.detail-item {
  background: #0f172a;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.detail-item label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.detail-item span {
  font-size: 15px;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="header-bar">
    <div class="header-title">
      <h1>Patient Records</h1>
      <p>Manage and review clinical patient assessments</p>
    </div>
    <button class="export-btn" onclick="exportToExcel()">
      📊 Export to Excel
    </button>
  </div>

  <!-- Search & Category Filters -->
  <div class="filter-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by Patient ID or Name..." oninput="filterPatients()">
    </div>
    
    <div class="filter-pills">
      <button class="pill-btn active" onclick="setFilter('All', this)">All</button>
      <button class="pill-btn" onclick="setFilter('High Risk', this)">High Risk</button>
      <button class="pill-btn" onclick="setFilter('Moderate Risk', this)">Moderate Risk</button>
      <button class="pill-btn" onclick="setFilter('Low Risk', this)">Low Risk</button>
      <button class="pill-btn" onclick="setFilter('Smoker', this)">Smokers</button>
    </div>
  </div>

  <!-- Cards Grid Container -->
  <div class="patient-grid" id="patientGrid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
      Loading patients from server...
    </div>
  </div>

</div>

<!-- Patient Details Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modalName" style="margin:0 0 4px;">Patient Details</h2>
    <span id="modalId" class="patient-id-badge">ID: -</span>

    <div class="detail-grid">
      <div class="detail-item"><label>OPD Number</label><span id="modalOpd">-</span></div>
      <div class="detail-item"><label>Age / Sex</label><span id="modalAgeSex">-</span></div>
      <div class="detail-item"><label>Residence</label><span id="modalResidence">-</span></div>
      <div class="detail-item"><label>Risk Category</label><span id="modalRisk">-</span></div>
      <div class="detail-item"><label>Smoking Habit</label><span id="modalSmoking">-</span></div>
      <div class="detail-item"><label>Smoking Frequency</label><span id="modalSmokeDetails">-</span></div>
      <div class="detail-item"><label>Chewing Habit</label><span id="modalChewing">-</span></div>
      <div class="detail-item"><label>Registration Date</label><span id="modalDate">-</span></div>
    </div>
  </div>
</div>

<script>
let patients = [];
let activeFilter = 'All';

// Dynamic API Endpoint Config Resolver
function getApiUrl() {
  if (typeof CONFIG !== 'undefined' && CONFIG.API_BASE_URL) {
    return `${CONFIG.API_BASE_URL}/patients`;
  } else if (typeof API_BASE_URL !== 'undefined') {
    return `${API_BASE_URL}/patients`;
  }
  return '/api/patients'; // Fallback relative path
}

// Fetch Records from Backend Config Target
async function loadPatientsFromApi() {
  const grid = document.getElementById('patientGrid');
  try {
    const response = await fetch(getApiUrl());
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    
    const data = await response.json();
    patients = Array.isArray(data) ? data : (data.patients || []);
    renderPatients();
  } catch (error) {
    console.error('Failed to fetch patient data:', error);
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--danger); padding: 40px;">
      Failed to connect to backend service. Please check configuration.
    </div>`;
  }
}

function renderPatients() {
  const grid = document.getElementById('patientGrid');
  const searchVal = document.getElementById('searchInput').value.toLowerCase();
  
  grid.innerHTML = '';

  const filtered = patients.filter(p => {
    const idStr = (p.patient_id || p.id || '').toString().toLowerCase();
    const nameStr = (p.patient_name || p.name || '').toLowerCase();
    const matchesSearch = nameStr.includes(searchVal) || idStr.includes(searchVal);
    
    const riskVal = p.risk_level || p.risk || 'Low Risk';
    const smokingVal = p.smoking || 'No';

    let matchesCategory = true;
    if (activeFilter === 'High Risk') matchesCategory = riskVal === 'High Risk';
    else if (activeFilter === 'Moderate Risk') matchesCategory = riskVal === 'Moderate Risk';
    else if (activeFilter === 'Low Risk') matchesCategory = riskVal === 'Low Risk';
    else if (activeFilter === 'Smoker') matchesCategory = smokingVal === 'Yes';

    return matchesSearch && matchesCategory;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
      No matching patient records found.
    </div>`;
    return;
  }

  filtered.forEach(p => {
    const id = p.patient_id || p.id || 'N/A';
    const name = p.patient_name || p.name || 'Unnamed';
    const risk = p.risk_level || p.risk || 'Low Risk';
    const age = p.age || 'N/A';
    const sex = p.sex || 'N/A';
    const residence = p.residence || 'N/A';

    const riskClass = risk === 'High Risk' ? 'risk-high' : risk === 'Moderate Risk' ? 'risk-moderate' : 'risk-low';

    const card = document.createElement('div');
    card.className = 'patient-card';
    card.innerHTML = `
      <div>
        <div class="card-header">
          <span class="patient-id-badge">ID: ${id}</span>
          <span class="risk-badge ${riskClass}">${risk}</span>
        </div>
        <h3 class="patient-name">${name}</h3>
        <div class="patient-subtext">${age} Yrs • ${sex} • ${residence}</div>
      </div>
      <button class="view-btn" onclick='openModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>View Full Details</button>
    `;
    grid.appendChild(card);
  });
}

function setFilter(category, btnElement) {
  activeFilter = category;
  document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');
  renderPatients();
}

function filterPatients() {
  renderPatients();
}

function openModal(p) {
  document.getElementById('modalName').textContent = p.patient_name || p.name || 'N/A';
  document.getElementById('modalId').textContent = `ID: ${p.patient_id || p.id || 'N/A'}`;
  document.getElementById('modalOpd').textContent = p.opd_number || p.opd || 'N/A';
  document.getElementById('modalAgeSex').textContent = `${p.age || 'N/A'} Yrs / ${p.sex || 'N/A'}`;
  document.getElementById('modalResidence').textContent = p.residence || 'N/A';
  document.getElementById('modalRisk').textContent = p.risk_level || p.risk || 'Low Risk';
  document.getElementById('modalSmoking').textContent = p.smoking || 'No';
  
  const smokingYears = p.smoking_duration_years || p.smokingYears || 0;
  const smokingFreq = p.smoking_frequency_per_day || p.smokingFreq || 0;
  document.getElementById('modalSmokeDetails').textContent = p.smoking === 'Yes' ? `${smokingYears} Yrs (${smokingFreq}/day)` : 'N/A';
  
  document.getElementById('modalChewing').textContent = p.chewing || 'No';
  document.getElementById('modalDate').textContent = p.created_at || p.date || new Date().toISOString().slice(0, 10);

  document.getElementById('detailModal').classList.add('active');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('active');
}

/* Export Live Records to Excel File */
function exportToExcel() {
  if (patients.length === 0) {
    alert("No patient data available to export.");
    return;
  }

  const exportData = patients.map(p => ({
    "Patient ID": p.patient_id || p.id || '',
    "Full Name": p.patient_name || p.name || '',
    "OPD Number": p.opd_number || p.opd || '',
    "Age": p.age || '',
    "Sex": p.sex || '',
    "Residence": p.residence || '',
    "Risk Level": p.risk_level || p.risk || '',
    "Smoking Habit": p.smoking || '',
    "Smoking Duration (Yrs)": p.smoking_duration_years || p.smokingYears || 0,
    "Smoking Frequency/Day": p.smoking_frequency_per_day || p.smokingFreq || 0,
    "Chewing Habit": p.chewing || '',
    "Registration Date": p.created_at || p.date || ''
  }));

  const worksheet = XLSX.utils.json_to_sheet(exportData);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Patients");

  XLSX.writeFile(workbook, `Patient_Records_${new Date().toISOString().slice(0,10)}.xlsx`);
}

window.addEventListener('DOMContentLoaded', loadPatientsFromApi);
</script>

</body>
</html>
