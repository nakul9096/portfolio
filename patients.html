<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oral Clinical Assessments</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Central Config -->
<script src="config/config.js"></script>

<!-- SheetJS for Exporting -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #090d16;
  --surface: #111827;
  --surface-hover: #1f2937;
  --border: #1f293d;
  --border-light: #2d3748;
  
  --text-primary: #f9fafb;
  --text-secondary: #9ca3af;
  --text-muted: #6b7280;
  
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  
  --danger-bg: rgba(239, 68, 68, 0.1);
  --danger-text: #f87171;
  --danger-border: rgba(239, 68, 68, 0.2);

  --warning-bg: rgba(245, 158, 11, 0.1);
  --warning-text: #fbbf24;
  --warning-border: rgba(245, 158, 11, 0.2);

  --success-bg: rgba(16, 185, 129, 0.1);
  --success-text: #34d399;
  --success-border: rgba(16, 185, 129, 0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-primary);
  line-height: 1.5;
  font-size: 14px;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* Page Header */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-center;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.title-area h1 {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.title-area p {
  color: var(--text-secondary);
  font-size: 13px;
  margin-top: 2px;
}

/* Primary Action Button */
.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}

.btn-secondary:hover {
  background: var(--surface-hover);
  border-color: var(--text-muted);
}

/* Filter Section */
.controls-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.search-wrapper {
  position: relative;
  flex: 1;
  min-width: 280px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 16px;
  height: 16px;
}

.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 9px 12px 9px 36px;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus {
  border-color: var(--accent);
}

.filter-group {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px;
  gap: 2px;
}

.filter-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover {
  color: var(--text-primary);
}

.filter-btn.active {
  background: #1f293d;
  color: var(--text-primary);
}

/* Patient Card Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color 0.15s;
}

.card:hover {
  border-color: var(--border-light);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.opd-badge {
  font-family: monospace;
  font-size: 12px;
  color: var(--text-secondary);
  background: #0d1321;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.status-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.02em;
}

.status-high { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
.status-moderate { background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }
.status-low { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }

.patient-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.patient-meta {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.info-block {
  background: #0d1321;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 16px;
  font-size: 12px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.info-row:last-child { margin-bottom: 0; }

.info-label { color: var(--text-muted); }
.info-val { color: var(--text-secondary); font-weight: 500; }

.btn-card {
  width: 100%;
  background: #192233;
  border: 1px solid var(--border-light);
  color: var(--text-primary);
  padding: 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-card:hover {
  background: var(--accent);
  border-color: var(--accent);
}

/* Minimal Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 8px;
  width: 100%;
  max-width: 720px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.modal-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
}

.modal-close:hover { color: var(--text-primary); }

.section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--accent);
  letter-spacing: 0.05em;
  margin: 16px 0 8px;
}

.data-table {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.data-cell {
  background: #0d1321;
  padding: 8px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.data-cell label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
}

.data-cell span {
  font-size: 13px;
  color: var(--text-primary);
  font-weight: 500;
}
</style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <header class="page-header">
    <div class="title-area">
      <h1>Oral Clinical Assessments</h1>
      <p>Direct view of recorded patient examinations</p>
    </div>
    <button class="btn-secondary" onclick="exportToExcel()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV/Excel
    </button>
  </header>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search OPD, Name, or Patient ID..." oninput="filterPatients()">
    </div>
    
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
      <button class="filter-btn" onclick="setFilter('High Risk', this)">High Risk</button>
      <button class="filter-btn" onclick="setFilter('Smoker', this)">Smokers</button>
      <button class="filter-btn" onclick="setFilter('Chewing', this)">Chewing</button>
      <button class="filter-btn" onclick="setFilter('Alcohol', this)">Alcohol</button>
    </div>
  </div>

  <!-- Main Grid -->
  <main class="grid" id="patientGrid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
      Loading assessment records...
    </div>
  </main>

</div>

<!-- Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h2 id="modalName" style="font-size: 18px; font-weight: 600;">Patient Assessment</h2>
        <p id="modalSub" style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">OPD: - | ID: -</p>
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="section-title">Demographics & History</div>
    <div class="data-table">
      <div class="data-cell"><label>Age / Sex</label><span id="mAgeSex">-</span></div>
      <div class="data-cell"><label>Residence</label><span id="mResidence">-</span></div>
      <div class="data-cell"><label>Occupation</label><span id="mOccupation">-</span></div>
      <div class="data-cell"><label>Marital Status</label><span id="mMarital">-</span></div>
    </div>

    <div class="section-title">Personal Habits</div>
    <div class="data-table">
      <div class="data-cell"><label>Smoking</label><span id="mSmoking">-</span></div>
      <div class="data-cell"><label>Smoking Years/Freq</label><span id="mSmokeDetails">-</span></div>
      <div class="data-cell"><label>Chewing Habit</label><span id="mChewing">-</span></div>
      <div class="data-cell"><label>Alcohol Consumption</label><span id="mAlcohol">-</span></div>
    </div>

    <div class="section-title">Clinical Findings</div>
    <div class="data-table">
      <div class="data-cell"><label>Lesion Location</label><span id="mLesionLoc">-</span></div>
      <div class="data-cell"><label>Lesion Size (Max Dia)</label><span id="mLesionDim">-</span></div>
      <div class="data-cell"><label>Ulcer Duration > 2 Wks</label><span id="mUlcer">-</span></div>
      <div class="data-cell"><label>Lymph Nodes Palpable</label><span id="mLymph">-</span></div>
    </div>
  </div>
</div>

<script>
let supabaseClient = null;
let patients = [];
let activeFilter = 'All';

function initSupabase() {
  if (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) {
    supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  }
}

function computeRiskLevel(p) {
  let score = 0;
  if (p.smoking && p.smoking.toLowerCase() === 'yes') score += 1;
  if (p.any_chewing_habits && p.any_chewing_habits.toLowerCase() === 'yes') score += 2;
  if (p.alcohol && p.alcohol.toLowerCase() === 'yes') score += 1;
  if (p.ulcer_greater_than_2_weeks && p.ulcer_greater_than_2_weeks.toLowerCase() === 'yes') score += 2;
  if (p.regional_lymph_node_palpability && p.regional_lymph_node_palpability.toLowerCase().includes('palpable')) score += 2;

  if (score >= 4) return 'High Risk';
  if (score >= 2) return 'Moderate Risk';
  return 'Low Risk';
}

async function loadPatientsFromSupabase() {
  const grid = document.getElementById('patientGrid');
  if (!supabaseClient) initSupabase();

  try {
    const { data, error } = await supabaseClient
      .from('oral_clinical_assessments')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;
    patients = data || [];
    renderPatients();
  } catch (err) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--danger-text); padding: 40px;">
      Failed to retrieve database entries: ${err.message}
    </div>`;
  }
}

function renderPatients() {
  const grid = document.getElementById('patientGrid');
  const searchVal = document.getElementById('searchInput').value.toLowerCase();
  grid.innerHTML = '';

  const filtered = patients.filter(p => {
    const idStr = (p.patient_id || '').toString().toLowerCase();
    const nameStr = (p.patient_name || '').toLowerCase();
    const opdStr = (p.opd_number || '').toLowerCase();
    const matchesSearch = nameStr.includes(searchVal) || idStr.includes(searchVal) || opdStr.includes(searchVal);
    const risk = computeRiskLevel(p);

    let matchesCategory = true;
    if (activeFilter === 'High Risk') matchesCategory = risk === 'High Risk';
    else if (activeFilter === 'Smoker') matchesCategory = (p.smoking || '').toLowerCase() === 'yes';
    else if (activeFilter === 'Chewing') matchesCategory = (p.any_chewing_habits || '').toLowerCase() === 'yes';
    else if (activeFilter === 'Alcohol') matchesCategory = (p.alcohol || '').toLowerCase() === 'yes';

    return matchesSearch && matchesCategory;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
      No assessment records found matching criteria.
    </div>`;
    return;
  }

  filtered.forEach(p => {
    const risk = computeRiskLevel(p);
    const riskClass = risk === 'High Risk' ? 'status-high' : risk === 'Moderate Risk' ? 'status-moderate' : 'status-low';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div>
        <div class="card-top">
          <span class="opd-badge">${p.opd_number || 'OPD-N/A'}</span>
          <span class="status-badge ${riskClass}">${risk}</span>
        </div>
        <div class="patient-name">${p.patient_name || 'Unnamed Record'}</div>
        <div class="patient-meta">ID: ${p.patient_id || 'N/A'} • ${p.age || 'N/A'} Yrs • ${p.sex || 'N/A'}</div>
        
        <div class="info-block">
          <div class="info-row"><span class="info-label">Lesion Loc:</span><span class="info-val">${p.lesion_location || 'N/A'}</span></div>
          <div class="info-row"><span class="info-label">Chewing:</span><span class="info-val">${p.any_chewing_habits || 'No'}</span></div>
        </div>
      </div>
      <button class="btn-card" onclick='openModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>View Assessment</button>
    `;
    grid.appendChild(card);
  });
}

function setFilter(category, btnElement) {
  activeFilter = category;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');
  renderPatients();
}

function filterPatients() { renderPatients(); }

function openModal(p) {
  document.getElementById('modalName').textContent = p.patient_name || 'N/A';
  document.getElementById('modalSub').textContent = `OPD: ${p.opd_number || 'N/A'} | ID: ${p.patient_id || 'N/A'}`;
  
  document.getElementById('mAgeSex').textContent = `${p.age || 'N/A'} Yrs / ${p.sex || 'N/A'}`;
  document.getElementById('mResidence').textContent = p.residence || 'N/A';
  document.getElementById('mOccupation').textContent = p.occupation || 'N/A';
  document.getElementById('mMarital').textContent = p.marital_status || 'N/A';

  document.getElementById('mSmoking').textContent = p.smoking || 'No';
  document.getElementById('mSmokeDetails').textContent = p.smoking === 'Yes' ? `${p.smoking_duration_years || 0} yrs (${p.smoking_frequency_per_day || 0}/day)` : 'N/A';
  document.getElementById('mChewing').textContent = p.any_chewing_habits || 'No';
  document.getElementById('mAlcohol').textContent = p.alcohol || 'No';

  document.getElementById('mLesionLoc').textContent = p.lesion_location || 'N/A';
  document.getElementById('mLesionDim').textContent = `${p.lesion_maximum_diameter_cm || 0} cm`;
  document.getElementById('mUlcer').textContent = p.ulcer_greater_than_2_weeks || 'No';
  document.getElementById('mLymph').textContent = p.regional_lymph_node_palpability || 'No';

  document.getElementById('detailModal').classList.add('active');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('active');
}

function exportToExcel() {
  if (patients.length === 0) return alert("No data available to export.");
  const worksheet = XLSX.utils.json_to_sheet(patients);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Assessments");
  XLSX.writeFile(workbook, `Clinical_Assessments_${new Date().toISOString().slice(0,10)}.xlsx`);
}

window.addEventListener('DOMContentLoaded', loadPatientsFromSupabase);
</script>

</body>
</html>
