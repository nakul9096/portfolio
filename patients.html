/* ================================

.top-nav {

  color: var(--text-primary);

  font-size: 11px;

  gap: 4px;

  align-items: center;

  color: var(--text-secondary);
  text-decoration: none;

  font-size: 12px;
  font-weight: 500;

  border: 1px solid transparent;
  border-radius: 6px;

  transition: all 0.15s ease;
}

.nav-link:hover {
  color: var(--text-primary);
  background: var(--surface);

}

.nav-link.active {
  color: #ffffff;

  border-color: var(--border-light);
}

.nav-link.active svg {
  color: #60a5fa;
}

@media(max-width: 900px) {
  .top-nav {

    align-items: flex-start;

}

@media(max-width: 600px) {

    display: grid;

}

### Where to put it

Your current structure:

```html
<body>

<div class="container">

  <!-- Header -->
  <header class="page-header">
     ...
  </header>
```

should become:

```html
<body>

<!-- Navigation -->
<header class="top-nav">
   ...
</header>

<div class="container">

  <!-- Page Header -->
  <header class="page-header">
     <div class="title-area">
       <h1>View Patients</h1>
       <p>Direct view of recorded patient examinations</p>
     </div>

     <button class="btn-secondary" onclick="exportToExcel()">
       ...
       Export CSV/Excel
     </button>
  </header>
```

And importantly, **`View Patients` gets the `active` class** on this page.

For your other pages, keep exactly the same header and simply move `active`:

* `patients.html` → **View Patients active**
* `registerpatients.html` → **Register Patient active**
* `analytics.html` → **Analytics active**
* `oral_clinical_assessment.html` → **Assessment active**
* `nfc.html` → **NFC Card active**

This will give all five pages a consistent navigation system.
