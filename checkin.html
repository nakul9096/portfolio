<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In | Attendance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- External Secure Config File (Adjusted to config/) -->
    <script src="config/config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { dark: '#030712', card: '#0b0f19', accent: '#3b82f6' } },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['Space Grotesk', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030712; color: #F3F4F6; }
    </style>
</head>
<body class="font-sans antialiased bg-[#030712] min-h-screen flex items-center justify-center p-6">
    <div class="bg-[#0b0f19] border border-gray-800 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative overflow-hidden">
        
        <!-- Loading State -->
        <div id="loading-state" class="py-10 space-y-4">
            <i class="fa-solid fa-circle-notch animate-spin text-blue-500 text-3xl"></i>
            <h2 class="text-xl font-bold text-white font-mono">Verifying Session...</h2>
            <p class="text-xs text-gray-400">Please wait while we load the attendance portal.</p>
        </div>

        <!-- Attendance Form State -->
        <div id="form-state" class="hidden py-4 space-y-5 text-left">
            <div class="text-center">
                <div class="w-14 h-14 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-clipboard-user"></i>
                </div>
                <h2 class="text-xl font-bold text-white font-mono">Mark Attendance</h2>
                <p class="text-xs text-gray-400 mt-1">Enter your details below to log your presence.</p>
            </div>

            <form onsubmit="handleAttendanceSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1.5">Full Name</label>
                    <input type="text" id="student-name-input" placeholder="e.g. Nakul Dhande" required
                           class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1.5">Roll Number</label>
                    <input type="text" id="student-roll-input" placeholder="e.g. 24" required
                           class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-3 rounded-xl transition active:scale-95 flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-check text-xs"></i> Mark Present
                </button>
            </form>
        </div>

        <!-- Success State -->
        <div id="success-state" class="hidden py-6 space-y-4">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-white font-mono">Attendance Recorded!</h2>
            <p class="text-xs text-gray-400">You have been marked present successfully.</p>
            <div class="bg-gray-950 border border-gray-800 rounded-2xl p-4 text-left font-mono text-xs space-y-2 mt-4">
                <p class="text-gray-400">Name: <span id="display-name" class="text-white font-semibold">--</span></p>
                <p class="text-gray-400">Roll No: <span id="display-roll" class="text-white font-semibold">--</span></p>
                <p class="text-gray-400">Time: <span id="checkin-time" class="text-emerald-400 font-semibold">--</span></p>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden py-6 space-y-4">
            <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 text-red-400 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="text-xl font-bold text-white font-mono">Check-In Restricted</h2>
            <p id="error-message" class="text-xs text-red-400 font-mono">Invalid session or database error.</p>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = window.CONFIG?.SUPABASE_URL || "";
        const SUPABASE_ANON_KEY = window.CONFIG?.SUPABASE_ANON_KEY || "";

        let supabaseClient = null;
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get("session");

        document.addEventListener("DOMContentLoaded", () => {
            if (!supabaseClient) {
                showState("error-state");
                document.getElementById("error-message").innerText = "Configuration missing: Check config/config.js";
                return;
            }

            if (!sessionId) {
                showState("error-state");
                document.getElementById("error-message").innerText = "Missing attendance session parameter in URL.";
                return;
            }

            // Check if this device has already submitted attendance for this specific session
            const storedCheckin = localStorage.getItem(`submitted_session_${sessionId}`);
            if (storedCheckin) {
                showState("error-state");
                document.getElementById("error-message").innerText = "Attendance has already been submitted from this device for this session.";
                return;
            }

            showState("form-state");
        });

        async function handleAttendanceSubmit(e) {
            e.preventDefault();

            const name = document.getElementById("student-name-input").value.trim();
            const rollNo = document.getElementById("student-roll-input").value.trim();

            if (!name || !rollNo) return;

            showState("loading-state");

            // Insert attendance record into Supabase
            const { error } = await supabaseClient
                .from("attendance_records")
                .insert([{
                    session_id: sessionId,
                    student_name: name,
                    roll_no: rollNo
                }]);

            if (error) {
                showState("error-state");
                document.getElementById("error-message").innerText = "Database error: " + error.message;
                return;
            }

            // Lock this device out from submitting to this session again using local storage
            localStorage.setItem(`submitted_session_${sessionId}`, "true");

            displaySuccessUI(name, rollNo, new Date());
        }

        function displaySuccessUI(name, rollNo, time) {
            showState("success-state");
            document.getElementById("display-name").innerText = name;
            document.getElementById("display-roll").innerText = rollNo;
            document.getElementById("checkin-time").innerText = time.toLocaleTimeString();
        }

        function showState(stateId) {
            ["loading-state", "form-state", "success-state", "error-state"].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add("hidden");
            });
            const target = document.getElementById(stateId);
            if (target) target.classList.remove("hidden");
        }
    </script>
</body>
</html>
