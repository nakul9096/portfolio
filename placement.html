<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Prep Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <!-- ================= LOADING OVERLAY ================= -->
  <div id="initLoader" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center gap-3">
    <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm text-slate-400">Loading Configuration...</p>
  </div>

  <!-- ================= AUTH VIEW ================= -->
  <div id="authContainer" class="hidden flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-slate-800/80 border border-slate-700 rounded-2xl p-8 shadow-2xl backdrop-blur-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 mb-3">
          <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Placement Portal</h1>
        <p class="text-sm text-slate-400 mt-1">Sign in to access study materials and MCQs</p>
      </div>

      <!-- Google OAuth Button -->
      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 px-4 rounded-xl transition border border-slate-600 shadow-sm mb-6">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="relative flex py-2 items-center mb-6">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase tracking-widest">Or Email Login</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <!-- Email Login Form -->
      <form onsubmit="handleEmailLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="you@domain.com" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition shadow-lg shadow-indigo-600/25">
          Sign In
        </button>
      </form>

      <div id="authError" class="mt-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center hidden"></div>
    </div>
  </div>

  <!-- ================= DASHBOARD VIEW ================= -->
  <div id="dashboardContainer" class="hidden min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-72 bg-slate-800/60 border-r border-slate-700/60 flex flex-col fixed inset-y-0 left-0 z-20">
      <div class="p-5 border-b border-slate-700/60 flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <i data-lucide="book-open-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="font-bold text-white leading-tight">Prep Hub</h2>
          <p class="text-xs text-slate-400">Placement Portal</p>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 overflow-y-auto p-4 space-y-6">
        <!-- Section: Aptitude -->
        <div>
          <h3 class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Aptitude</h3>
          <div class="space-y-1">
            <button onclick="selectCategory('Quantitative Aptitude')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700/50 hover:text-white transition">
              <i data-lucide="calculator" class="w-4 h-4 text-indigo-400"></i>
              Quantitative
            </button>
            <button onclick="selectCategory('Logical Reasoning')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700/50 hover:text-white transition">
              <i data-lucide="brain" class="w-4 h-4 text-emerald-400"></i>
              Logical Reasoning
            </button>
            <button onclick="selectCategory('Non-Verbal Reasoning')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700/50 hover:text-white transition">
              <i data-lucide="shapes" class="w-4 h-4 text-amber-400"></i>
              Non-Verbal
            </button>
          </div>
        </div>

        <!-- Section: Technical -->
        <div>
          <h3 class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Technical</h3>
          <div class="space-y-1">
            <button onclick="selectCategory('Data Structures')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700/50 hover:text-white transition">
              <i data-lucide="code-2" class="w-4 h-4 text-cyan-400"></i>
              DSA
            </button>
            <button onclick="selectCategory('CS Fundamentals')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700/50 hover:text-white transition">
              <i data-lucide="cpu" class="w-4 h-4 text-rose-400"></i>
              CS Fundamentals
            </button>
          </div>
        </div>
      </nav>

      <!-- User Info & Logout -->
      <div class="p-4 border-t border-slate-700/60 bg-slate-900/30">
        <div class="flex items-center justify-between">
          <div class="truncate mr-2">
            <p id="userEmailDisplay" class="text-xs font-medium text-slate-200 truncate"></p>
            <span class="text-[10px] text-emerald-400 flex items-center gap-1 mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Verified Access
            </span>
          </div>
          <button onclick="logout()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-lg transition" title="Logout">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 ml-72 p-8 min-h-screen">
      <!-- Top Bar Breadcrumb -->
      <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
        <div>
          <div class="flex items-center gap-2 text-sm text-slate-400">
            <span id="breadcrumbCategory">Dashboard</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <span id="breadcrumbSubtopic" class="text-indigo-400 font-medium">Select Topic</span>
          </div>
          <h1 id="mainTitle" class="text-2xl font-bold text-white mt-1">Select a Category</h1>
        </div>
      </header>

      <!-- View 1: Topic / Folder Selection -->
      <div id="topicsView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="col-span-full py-16 text-center text-slate-500">
          <i data-lucide="folder-search" class="w-12 h-12 mx-auto mb-3 stroke-[1.5]"></i>
          <p>Select a category from the sidebar to view subtopics.</p>
        </div>
      </div>

      <!-- View 2: Questions & Practice View -->
      <div id="practiceView" class="hidden max-w-4xl space-y-6">
        <button onclick="backToTopics()" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-white transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Subtopics
        </button>

        <!-- Formula Banner -->
        <div id="formulaBanner" class="hidden p-5 bg-indigo-950/40 border border-indigo-500/30 rounded-xl">
          <div class="flex items-start gap-3">
            <i data-lucide="lightbulb" class="w-5 h-5 text-amber-400 shrink-0 mt-0.5"></i>
            <div>
              <h4 class="text-sm font-semibold text-indigo-300 mb-1">Key Formula / Concept Note</h4>
              <div id="formulaContent" class="text-sm text-indigo-100/90 font-mono"></div>
            </div>
          </div>
        </div>

        <!-- Questions Container -->
        <div id="questionsContainer" class="space-y-6"></div>
      </div>
    </main>
  </div>

  <script>
    // Renamed local variable to avoid collision with global window.supabase object
    let supabaseClient = null;
    let currentUser = null;
    let currentCategory = '';
    let currentSubtopic = '';

    const TOPIC_STRUCTURE = {
      'Quantitative Aptitude': ['Problems on Trains', 'Boats and Streams', 'Time and Work', 'Permutations & Combinations', 'Probability'],
      'Logical Reasoning': ['Seating Arrangement', 'Blood Relations', 'Syllogism', 'Coding Decoding'],
      'Non-Verbal Reasoning': ['Series Completion', 'Mirror Images', 'Paper Folding'],
      'Data Structures': ['Arrays & Strings', 'Linked Lists', 'Trees & Graphs', 'Dynamic Programming'],
      'CS Fundamentals': ['Operating Systems', 'DBMS & SQL', 'Computer Networks']
    };

    // Initialize Supabase Client dynamically from /api/config
    async function initializeApp() {
      try {
        const response = await fetch('/api/config');
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || `Server error ${response.status}`);
        }
        
        const config = await response.json();

        // Support exact uppercase keys returned by your api/config.js
        const url = config.SUPABASE_URL || config.supabaseUrl;
        const key = config.SUPABASE_ANON_KEY || config.supabaseAnonKey;

        if (!url || !key) {
          throw new Error('SUPABASE_URL or SUPABASE_ANON_KEY is missing in /api/config response.');
        }

        // Initialize Supabase client
        supabaseClient = window.supabase.createClient(url, key);

        document.getElementById('initLoader').classList.add('hidden');
        lucide.createIcons();

        // Check current session
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          await validateAndSetUser(session.user);
        } else {
          showAuthUI();
        }

        // Auth state changes
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (session) {
            await validateAndSetUser(session.user);
          } else {
            showAuthUI();
          }
        });

      } catch (err) {
        console.error(err);
        document.getElementById('initLoader').innerHTML = `
          <div class="p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl max-w-md text-center">
            <strong>Initialization Error:</strong> ${err.message}
          </div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', initializeApp);

    async function validateAndSetUser(user) {
      const { data, error } = await supabaseClient
        .from('allowed_users')
        .select('email')
        .eq('email', user.email)
        .single();

      if (error || !data) {
        showError('Access Denied: Your email is not whitelisted.');
        await supabaseClient.auth.signOut();
        return;
      }

      currentUser = user;
      document.getElementById('userEmailDisplay').textContent = user.email;
      showDashboardUI();
      selectCategory('Quantitative Aptitude');
    }

    async function loginWithGoogle() {
      const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
      if (error) showError(error.message);
    }

    async function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) showError(error.message);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    function showError(msg) {
      const errDiv = document.getElementById('authError');
      errDiv.textContent = msg;
      errDiv.classList.remove('hidden');
    }

    function showAuthUI() {
      document.getElementById('authContainer').classList.remove('hidden');
      document.getElementById('dashboardContainer').classList.add('hidden');
    }

    function showDashboardUI() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('dashboardContainer').classList.remove('hidden');
    }

    function selectCategory(category) {
      currentCategory = category;
      document.getElementById('breadcrumbCategory').textContent = category;
      document.getElementById('breadcrumbSubtopic').textContent = 'Subtopics';
      document.getElementById('mainTitle').textContent = category;

      document.getElementById('practiceView').classList.add('hidden');
      document.getElementById('topicsView').classList.remove('hidden');

      const topicsView = document.getElementById('topicsView');
      const subtopics = TOPIC_STRUCTURE[category] || [];

      topicsView.innerHTML = subtopics.map(subtopic => `
        <div onclick="selectSubtopic('${subtopic}')" class="group p-6 bg-slate-800/40 hover:bg-slate-800/80 border border-slate-700/60 hover:border-indigo-500/50 rounded-2xl cursor-pointer transition-all duration-200">
          <div class="flex items-center justify-between mb-4">
            <div class="p-3 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white rounded-xl transition">
              <i data-lucide="folder" class="w-6 h-6"></i>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500 group-hover:text-indigo-400 group-hover:translate-x-1 transition"></i>
          </div>
          <h3 class="font-bold text-lg text-white group-hover:text-indigo-300 transition">${subtopic}</h3>
          <p class="text-xs text-slate-400 mt-1">Click to practice MCQs and formulas</p>
        </div>
      `).join('');

      lucide.createIcons();
    }

    async function selectSubtopic(subtopic) {
      currentSubtopic = subtopic;
      document.getElementById('breadcrumbSubtopic').textContent = subtopic;
      document.getElementById('mainTitle').textContent = subtopic;

      document.getElementById('topicsView').classList.add('hidden');
      document.getElementById('practiceView').classList.remove('hidden');

      await fetchQuestions(currentCategory, subtopic);
    }

    function backToTopics() {
      selectCategory(currentCategory);
    }

    async function fetchQuestions(category, subtopic) {
      const container = document.getElementById('questionsContainer');
      const formulaBanner = document.getElementById('formulaBanner');
      const formulaContent = document.getElementById('formulaContent');

      container.innerHTML = `<div class="py-12 text-center text-slate-400">Loading questions from Supabase...</div>`;
      formulaBanner.classList.add('hidden');

      const { data: questions, error } = await supabaseClient
        .from('questions')
        .select('*')
        .eq('category', category)
        .eq('subtopic', subtopic);

      if (error) {
        container.innerHTML = `<div class="p-4 bg-red-500/10 text-red-400 rounded-xl">Failed to load questions: ${error.message}</div>`;
        return;
      }

      if (!questions || questions.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center bg-slate-800/30 border border-slate-700/50 rounded-2xl">
            <i data-lucide="file-question" class="w-10 h-10 mx-auto text-slate-500 mb-2"></i>
            <h3 class="text-lg font-medium text-slate-300">No questions found</h3>
            <p class="text-sm text-slate-500 mt-1">Upload questions for "${subtopic}" in your Supabase database.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      const questionWithFormula = questions.find(q => q.formula);
      if (questionWithFormula) {
        formulaContent.textContent = questionWithFormula.formula;
        formulaBanner.classList.remove('hidden');
      }

      container.innerHTML = questions.map((q, idx) => `
        <div class="p-6 bg-slate-800/40 border border-slate-700/60 rounded-2xl space-y-4">
          <div class="flex items-start justify-between gap-4">
            <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-700 text-slate-300">Q${idx + 1}</span>
            <p class="text-slate-100 font-medium text-base flex-1">${q.question_text}</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
            ${['A', 'B', 'C', 'D'].map(optKey => {
              const optText = q[`option_${optKey.toLowerCase()}`];
              return `
                <button onclick="checkAnswer(this, '${optKey}', '${q.correct_option}', 'exp-${q.id}')" 
                  class="option-btn text-left p-3.5 rounded-xl border border-slate-700/80 bg-slate-900/40 hover:bg-slate-700/40 hover:border-slate-600 transition flex items-center justify-between group">
                  <span class="text-sm text-slate-300 font-medium"><strong class="text-slate-500 group-hover:text-indigo-400 mr-2">${optKey}.</strong> ${optText}</span>
                  <i data-lucide="circle" class="w-4 h-4 text-slate-600 icon-status"></i>
                </button>
              `;
            }).join('')}
          </div>

          <div id="exp-${q.id}" class="hidden p-4 rounded-xl bg-slate-900/80 border border-slate-700/60 text-sm text-slate-300 mt-4 space-y-1">
            <p class="font-semibold text-indigo-400">Explanation:</p>
            <p>${q.explanation || 'No detailed explanation provided.'}</p>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function checkAnswer(selectedBtn, selectedOpt, correctOpt, expId) {
      const parentCard = selectedBtn.closest('.space-y-4');
      const allButtons = parentCard.querySelectorAll('.option-btn');

      allButtons.forEach(btn => btn.style.pointerEvents = 'none');

      if (selectedOpt === correctOpt) {
        selectedBtn.classList.add('bg-emerald-950/40', 'border-emerald-500/50', 'text-emerald-300');
        selectedBtn.querySelector('.icon-status').outerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>`;
      } else {
        selectedBtn.classList.add('bg-rose-950/40', 'border-rose-500/50', 'text-rose-300');
        selectedBtn.querySelector('.icon-status').outerHTML = `<i data-lucide="x-circle" class="w-4 h-4 text-rose-400"></i>`;

        allButtons.forEach(btn => {
          if (btn.innerText.startsWith(correctOpt)) {
            btn.classList.add('bg-emerald-950/40', 'border-emerald-500/50', 'text-emerald-300');
          }
        });
      }

      document.getElementById(expId).classList.remove('hidden');
      lucide.createIcons();
    }
  </script>
</body>
</html>
