<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web NFC Module - Patient Info</title>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Configuration file containing SUPABASE_URL and SUPABASE_ANON_KEY -->
    <script src="config/config.js"></script>
</head>
<body>

    <!-- Web NFC Handler Script -->
    <script>
        const TABLE_NAME = 'oral_clinical_assessments';
        let supabaseClient = null;
        let cachedPatients = [];
        let ndefWriter = null;
        let ndefReader = null;

        // Initialize Supabase Connection
        function initSupabase() {
            try {
                const url = window.CONFIG?.SUPABASE_URL;
                const key = window.CONFIG?.SUPABASE_ANON_KEY;

                if (!url || !key) {
                    console.error("Missing SUPABASE_URL or SUPABASE_ANON_KEY in window.CONFIG");
                    return;
                }

                supabaseClient = window.supabase.createClient(url, key);
                fetchAllPatientRecords();
            } catch (err) {
                console.error("Failed to initialize Supabase:", err);
            }
        }

        // Fetch all patient records from Supabase
        async function fetchAllPatientRecords() {
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_NAME)
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                cachedPatients = data || [];
                console.log(`Loaded ${cachedPatients.length} patient records from Supabase.`);
                
                // Optional: Update dropdown element if present in DOM
                const selectEl = document.getElementById('patientSelect');
                if (selectEl) {
                    selectEl.innerHTML = '<option value="" disabled selected>-- Select Patient Record --</option>';
                    cachedPatients.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.patient_id;
                        opt.textContent = `${p.patient_id} - ${p.patient_name} (OPD: ${p.opd_number})`;
                        selectEl.appendChild(opt);
                    });
                    selectEl.disabled = false;
                }
            } catch (err) {
                console.error("Error fetching patient records:", err);
            }
        }

        // Helper to retrieve cached patient object by ID
        window.getPatientById = (id) => cachedPatients.find(p => p.patient_id === id);

        // Check Web NFC API Compatibility
        function checkNFCSupport() {
            if (!('NDEFReader' in window)) {
                alert("Web NFC is not supported on this browser or device. Please use Chrome on Android over HTTPS.");
                return false;
            }
            return true;
        }

        /**
         * WRITE PATIENT ID TO NFC TAG
         * @param {string} patientId - Target patient_id string to encode
         */
        async function writePatientNFC(patientId) {
            if (!checkNFCSupport()) return;

            if (!patientId) {
                alert("Please select or provide a valid Patient ID first.");
                return;
            }

            try {
                if (!ndefWriter) ndefWriter = new NDEFReader();

                // Format JSON Payload
                const payload = JSON.stringify({ patient_id: patientId });

                console.log("Approaching NFC Tag to write payload:", payload);
                
                await ndefWriter.write({
                    records: [{ recordType: "text", data: payload }]
                });

                alert(`Successfully encoded Patient ID: ${patientId} onto NFC Tag!`);
            } catch (err) {
                console.error("NFC Write Error:", err);
                alert(`NFC Write Failed: ${err.message || 'Operation aborted.'}`);
            }
        }

        /**
         * START READING/SCANNING NFC TAG
         * @param {Function} onRecordFoundCallback - Callback returning full database patient object
         */
        async function startNFCScan(onRecordFoundCallback) {
            if (!checkNFCSupport()) return;

            try {
                if (!ndefReader) ndefReader = new NDEFReader();
                await ndefReader.scan();
                console.log("NFC Scanner initialized and active. Waiting for NFC tap...");

                ndefReader.onreading = ({ message }) => {
                    const record = message.records.find(r => r.recordType === "text");
                    if (record) {
                        const decoder = new TextDecoder();
                        const decodedString = decoder.decode(record.data);
                        
                        try {
                            const decodedData = JSON.parse(decodedString);
                            const patientId = decodedData.patient_id || decodedData.id;

                            console.log("Scanned NFC Patient ID:", patientId);

                            const patientRecord = window.getPatientById(patientId);

                            if (patientRecord) {
                                if (typeof onRecordFoundCallback === 'function') {
                                    onRecordFoundCallback(patientRecord);
                                } else if (typeof renderCompletePatientData === 'function') {
                                    renderCompletePatientData(patientRecord);
                                } else {
                                    console.log("Patient Record Retrieved:", patientRecord);
                                }
                            } else {
                                alert(`NFC Tag scanned (Patient ID: "${patientId}"), but no matching record was found in the database.`);
                            }
                        } catch (jsonErr) {
                            console.error("Invalid JSON content on NFC tag:", decodedString);
                            alert("Scanned NFC tag contains unreadable or non-JSON data.");
                        }
                    }
                };

                ndefReader.onreadingerror = () => {
                    alert("NFC Read Error: Unable to process tag reading.");
                };

            } catch (err) {
                console.error("NFC Scan Error:", err);
                alert(`NFC Scan Failed to start: ${err.message || 'Hardware error.'}`);
            }
        }

        // Initialize connection on DOM load
        document.addEventListener('DOMContentLoaded', initSupabase);
    </script>
</body>
</html>
